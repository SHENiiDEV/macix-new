<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Obsidian & Platinum -->
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Rounded Diamond Shield -->
  <g filter="url(#subtleShadow)">
    <rect x="50" y="50" width="400" height="400" rx="90" fill="url(#obsidianGrad)" stroke="url(#borderGrad)" stroke-width="6"/>
  </g>

  <!-- Inner Ambient Geometric Grid -->
  <g opacity="0.12" stroke="#fbbf24" stroke-width="1.5">
    <line x1="250" y1="70" x2="250" y2="430"/>
    <line x1="70" y1="250" x2="430" y2="250"/>
    <circle cx="250" cy="250" r="140" fill="none" stroke-dasharray="6,6"/>
  </g>

  <!-- Central Emblem: Crown + Interconnected Neural 'M' -->
  <g filter="url(#goldGlow)">
    
    <!-- Left Column of M -->
    <path d="M 125 350 L 125 180 L 175 140 L 175 350 Z" fill="url(#goldDark)"/>
    <path d="M 125 180 L 175 140 L 175 330 L 140 350 Z" fill="url(#goldShine)"/>
    <path d="M 125 180 L 175 140 L 160 130 L 110 170 Z" fill="url(#goldLight)"/>

    <!-- Right Column of M -->
    <path d="M 375 350 L 375 180 L 325 140 L 325 350 Z" fill="url(#goldDark)"/>
    <path d="M 375 180 L 325 140 L 325 330 L 360 350 Z" fill="url(#goldShine)"/>
    <path d="M 375 180 L 325 140 L 340 130 L 390 170 Z" fill="url(#goldLight)"/>

    <!-- Center Chevron & Crown Peak of M -->
    <!-- Left Inward Wing -->
    <path d="M 175 140 L 250 245 L 225 270 L 175 200 Z" fill="url(#goldLight)"/>
    <!-- Right Inward Wing -->
    <path d="M 325 140 L 250 245 L 275 270 L 325 200 Z" fill="url(#goldShine)"/>

    <!-- Center Diamond Keystone (The Chairman's Eye) -->
    <polygon points="250,110 285,160 250,210 215,160" fill="url(#goldLight)" stroke="#fef08a" stroke-width="2"/>
    <polygon points="250,130 270,160 250,190 230,160" fill="url(#goldShine)"/>
    
    <!-- Core Sparkle Center -->
    <circle cx="250" cy="160" r="6" fill="#ffffff"/>
  </g>

  <!-- 4 Corner Executive Node Pins (The 4 Advisors) -->
  <circle cx="150" cy="140" r="7" fill="#38bdf8" filter="url(#goldGlow)"/> <!-- Investor -->
  <circle cx="350" cy="140" r="7" fill="#34d399" filter="url(#goldGlow)"/> <!-- Mentor -->
  <circle cx="150" cy="340" r="7" fill="#fbbf24" filter="url(#goldGlow)"/> <!-- Operator -->
  <circle cx="350" cy="340" r="7" fill="#f87171" filter="url(#goldGlow)"/> <!-- Devil's Advocate -->

</svg>
